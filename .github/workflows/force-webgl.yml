name: Force WebGL Advanced Eye Lab
on:
  push:
    paths:
      - '.github/workflows/force-webgl.yml'
permissions:
  contents: write
jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch Advanced Eye Lab to direct WebGL module
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<script src="./advanced-eye.js?v=20260917-advanced"></script>'
          new='<script type="module" src="./advanced-eye-webgl.js?v=20260917-webgl3"></script>'
          if old not in s:
              raise SystemExit('Old Advanced Eye script tag not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load WebGL advanced eye lab directly"
          git push