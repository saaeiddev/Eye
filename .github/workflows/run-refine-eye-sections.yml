name: Run Scoped Eye Section Refinement
on:
  push:
    paths:
      - '.github/workflows/run-refine-eye-sections.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply scoped patch
        run: python .github/scripts/refine_eye_sections.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add advanced-eye-webgl.js index.html
          git commit -m "Refine Eye Disorders and Visual Cortex only"
          git push
