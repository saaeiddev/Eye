name: Refine Eye Disorders and Visual Cortex
on:
  push:
    paths:
      - '.github/workflows/refine-disorders-cortex.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine only Eye Disorders and Eye to Visual Cortex
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('advanced-eye-webgl.js')
          s=p.read_text()

          s=s.replace("disorders:'Eye Disorders', disordersText:'Compare how focus changes in common optical conditions.'", "disorders:'Eye Disorders', disordersText:'Compare optical focusing and structural changes in myopia, hyperopia, astigmatism, cataract and glaucoma.'")
          s=s.replace("disorders:'اختلالات چشم', disordersText:'تغییر محل فوکوس را در اختلالات اپتیکی رایج مقایسه کن.'", "disorders:'اختلالات چشم', disordersText:'تغییرات اپتیکی و ساختاری در نزدیک‌بینی، دوربینی، آستیگماتیسم، آب مروارید و گلوکوم را مقایسه کن.'")

          disorder=r'''function initDisorder(){
  const c=section.querySelector('#disorder3d'); if(!c)return;
  const v=setup(c,[5.7,2.8,7.7],[0,0,-.15]); const {scene,loopFns}=v;

  const anatomy=new THREE.Group(); anatomy.rotation.y=-.38; scene.add(anatomy);
  const shell=new THREE.Mesh(new THREE.SphereGeometry(1.5,72,54),mat(0xf1ede4,{transparent:true,opacity:.22,roughness:.26,clearcoat:.3,side:THREE.DoubleSide,depthWrite:false})); anatomy.add(shell);
  const choroid=new THREE.Mesh(new THREE.SphereGeometry(1.43,64,48),basic(0x742d35,{transparent:true,opacity:.22,side:THREE.DoubleSide,depthWrite:false})); anatomy.add(choroid);
  const retina=new THREE.Mesh(new THREE.SphereGeometry(1.37,64,48),basic(0xd46a59,{transparent:true,opacity:.72,side:THREE.BackSide})); anatomy.add(retina);

  const cornea=new THREE.Mesh(new THREE.SphereGeometry(.68,48,36,0,Math.PI*2,0,Math.PI/2),mat(0xcff7ff,{transparent:true,opacity:.2,roughness:.04,transmission:.18,depthWrite:false,side:THREE.DoubleSide}));
  cornea.rotation.x=-Math.PI/2; cornea.position.z=1.06; anatomy.add(cornea);
  const iris=new THREE.Mesh(new THREE.TorusGeometry(.43,.15,20,64),mat(0x4f8b79,{roughness:.5})); iris.position.z=1.28; anatomy.add(iris);
  const pupil=new THREE.Mesh(new THREE.CircleGeometry(.23,48),new THREE.MeshBasicMaterial({color:0x020304,side:THREE.DoubleSide})); pupil.position.z=1.31; anatomy.add(pupil);

  const lens=new THREE.Mesh(new THREE.SphereGeometry(.52,48,36),mat(0xdffaff,{transparent:true,opacity:.42,transmission:.48,roughness:.04,depthWrite:false})); lens.scale.z=.44; lens.position.z=.53; anatomy.add(lens);

  const opticNerve=tube([[0,0,-1.35],[.05,0,-2.05],[.18,.03,-2.75]],.18,basic(0xd6b38a,{roughness:.72}),64); anatomy.add(opticNerve.mesh);
  const disc=new THREE.Mesh(new THREE.TorusGeometry(.22,.065,18,48),basic(0xd7a276,{emissive:0x28130a,emissiveIntensity:.15})); disc.position.set(0,0,-1.375); anatomy.add(disc);
  const cup=new THREE.Mesh(new THREE.SphereGeometry(.105,24,16),basic(0xe7c09b,{emissive:0x241008,emissiveIntensity:.1})); cup.scale.z=.22; cup.position.set(0,0,-1.405); anatomy.add(cup);

  const cloud=new THREE.Group(); anatomy.add(cloud);
  const cloudMat=mat(0xe3d6ae,{transparent:true,opacity:.2,roughness:.8,depthWrite:false});
  for(let i=0;i<26;i++){
    const a=i*2.399, r=.08+(i%5)*.055;
    const m=new THREE.Mesh(new THREE.SphereGeometry(.07+(i%3)*.018,14,10),cloudMat.clone());
    m.position.set(Math.cos(a)*r,Math.sin(a)*r,(i%4-.5)*.035+.52); cloud.add(m);
  }
  cloud.visible=false;

  const focusA=new THREE.Mesh(new THREE.SphereGeometry(.085,18,12),basic(0xffe47b,{emissive:0xffc92e,emissiveIntensity:3})); anatomy.add(focusA);
  const focusB=focusA.clone(); anatomy.add(focusB); focusB.visible=false;

  const rayGroup=new THREE.Group(); anatomy.add(rayGroup);
  const photonMat=basic(0xfff0a0,{emissive:0xffc936,emissiveIntensity:2.5});
  const photons=[]; for(let i=0;i<18;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.035,10,8),photonMat);anatomy.add(m);photons.push({m,o:i/18})}
  let rayCurves=[];

  function clearRays(){
    rayGroup.children.slice().forEach(o=>{rayGroup.remove(o);o.geometry?.dispose?.();o.material?.dispose?.()});
    rayCurves=[];
  }
  function addRay(points,color=0xffdf6d,opacity=.78){
    const material=basic(color,{transparent:true,opacity,emissive:color,emissiveIntensity:.65,roughness:.35});
    const r=tube(points,.018,material,44); rayGroup.add(r.mesh); rayCurves.push(r.curve);
  }
  function bundle(focus,spread=.62,color=0xffdf6d){
    for(let i=0;i<7;i++){
      const a=i/7*Math.PI*2, x=Math.cos(a)*spread, y=Math.sin(a)*spread;
      addRay([[x,y,4.2],[x*.48,y*.48,1.48],[x*.12,y*.12,.54],focus],color);
    }
  }
  function setAxialScale(zScale){
    const shift=1.5*(1-zScale);
    [shell,choroid,retina].forEach(o=>{o.scale.z=zScale;o.position.z=shift});
    const back=shift-1.37*zScale;
    disc.position.z=back-.015; cup.position.z=back-.04;
    opticNerve.mesh.position.z=back+1.37;
    return back;
  }
  function resetAppearance(){
    cornea.scale.set(1,1,1); lens.material.color.setHex(0xdffaff); lens.material.opacity=.42; lens.material.roughness=.04;
    cloud.visible=false; disc.material.color.setHex(0xd7a276);disc.material.emissive.setHex(0x28130a);disc.material.emissiveIntensity=.15;
    cup.material.color.setHex(0xe7c09b);cup.material.emissive.setHex(0x241008);cup.material.emissiveIntensity=.1;cup.scale.set(1,1,.22);
    focusA.visible=true;focusB.visible=false;focusA.scale.set(1,1,1);focusB.scale.set(1,1,1);
  }
  function update(k){
    clearRays(); resetAppearance();
    let back=setAxialScale(1), focusZ=back+.035;
    if(k==='myopia'){
      back=setAxialScale(1.08); focusZ=-1.02; bundle([0,0,focusZ]);
    }else if(k==='hyperopia'){
      back=setAxialScale(.93); focusZ=-1.63; bundle([0,0,focusZ]);
    }else if(k==='astigmatism'){
      setAxialScale(1); cornea.scale.set(1.24,.82,1);
      focusA.position.set(0,0,-.88); focusA.scale.set(2.6,.45,.45);
      focusB.visible=true;focusB.position.set(0,0,-1.58);focusB.scale.set(.45,2.6,.45);
      for(let i=-3;i<=3;i++){
        const q=i*.22;
        addRay([[q,0,4.2],[q*.5,0,1.48],[q*.12,0,.54],[0,0,-.88]],0xffd861);
        addRay([[0,q,4.2],[0,q*.5,1.48],[0,q*.12,.54],[0,0,-1.58]],0xffb56b);
      }
      focusZ=-.88;
    }else if(k==='cataract'){
      setAxialScale(1); cloud.visible=true;lens.material.color.setHex(0xd8c795);lens.material.opacity=.7;lens.material.roughness=.55;
      focusA.visible=false;
      for(let i=0;i<13;i++){
        const a=i/13*Math.PI*2,x=Math.cos(a)*.62,y=Math.sin(a)*.62;
        const end=[Math.sin(i*2.1)*.42,Math.cos(i*1.7)*.38,-1.28+(i%3-.9)*.12];
        addRay([[x,y,4.2],[x*.48,y*.48,1.48],[x*.12,y*.12,.54],end],0xffdf88,.52);
      }
    }else if(k==='glaucoma'){
      back=setAxialScale(1);focusZ=back+.035;bundle([0,0,focusZ],.62,0xffdf6d);
      disc.material.color.setHex(0xc95b4f);disc.material.emissive.setHex(0x65170f);disc.material.emissiveIntensity=1.0;
      cup.material.color.setHex(0x7e2d2a);cup.material.emissive.setHex(0x53100d);cup.material.emissiveIntensity=.8;cup.scale.set(1.9,1.9,.3);
    }else{
      back=setAxialScale(1);focusZ=back+.035;bundle([0,0,focusZ]);
    }
    if(k!=='astigmatism'&&k!=='cataract')focusA.position.set(0,0,focusZ);
    section.querySelectorAll('[data-disorder]').forEach(b=>b.classList.toggle('active',b.dataset.disorder===k));
  }

  section.querySelectorAll('[data-disorder]').forEach(b=>b.addEventListener('click',()=>update(b.dataset.disorder)));
  loopFns.push(t=>{
    photons.forEach((x,i)=>{
      if(!rayCurves.length){x.m.visible=false;return}
      x.m.visible=true; const curve=rayCurves[i%rayCurves.length]; x.m.position.copy(curve.getPoint((t*.00016+x.o)%1));
    });
    cloud.rotation.z=t*.00008;
  });
  update('normal');
}'''

          cortex=r'''function initCortex(){
  const c=section.querySelector('#cortex3d');if(!c)return;
  const v=setup(c,[7.2,4.7,11.8],[0,0,-1.25]);const {scene,loopFns}=v;
  v.controls.minDistance=6;v.controls.maxDistance=18;
  const labels=lang()==='fa'?{chiasm:'کیاسمای بینایی',lgn:'LGN',v1:'قشر بینایی'}:{chiasm:'Optic chiasm',lgn:'LGN',v1:'Visual cortex'};

  const leftEye=makeEye(.66),rightEye=makeEye(.66);
  leftEye.position.set(-1.35,0,3.25);rightEye.position.set(1.35,0,3.25);
  leftEye.rotation.y=.04;rightEye.rotation.y=-.04;scene.add(leftEye,rightEye);

  const nerveMat=basic(0xd9bc98,{roughness:.78});
  const leftN=tube([[-1.35,0,2.35],[-1.2,0,1.55],[-.55,0,.62]],.14,nerveMat,64);scene.add(leftN.mesh);
  const rightN=tube([[1.35,0,2.35],[1.2,0,1.55],[.55,0,.62]],.14,nerveMat.clone(),64);scene.add(rightN.mesh);

  const chiasm=new THREE.Mesh(new THREE.SphereGeometry(.4,36,24),mat(0xd2b68f,{roughness:.62}));
  chiasm.scale.set(1.7,.48,.68);chiasm.position.set(0,0,.4);scene.add(chiasm);

  const lgnMat=mat(0x9a7cc4,{roughness:.5,clearcoat:.12});
  const lgnL=new THREE.Mesh(new THREE.SphereGeometry(.3,28,20),lgnMat);lgnL.scale.set(1,.72,1.35);lgnL.position.set(-1.12,0,-1.52);
  const lgnR=lgnL.clone();lgnR.material=lgnMat.clone();lgnR.position.x=1.12;scene.add(lgnL,lgnR);

  const tractBase=basic(0xbca2ce,{roughness:.68});
  scene.add(tube([[-.45,0,.23],[-.72,0,-.58],[-1.12,0,-1.52]],.12,tractBase,54).mesh);
  scene.add(tube([[.45,0,.23],[.72,0,-.58],[1.12,0,-1.52]],.12,tractBase.clone(),54).mesh);

  const temporalMat=basic(0x65c7e8,{emissive:0x143f52,emissiveIntensity:.5,roughness:.4});
  const nasalMat=basic(0xe3ad67,{emissive:0x573617,emissiveIntensity:.5,roughness:.4});
  const lTemporal=tube([[-1.35,.055,2.35],[-1.18,.06,1.5],[-.5,.08,.52],[-.75,.08,-.55],[-1.12,.08,-1.52]],.038,temporalMat,66);
  const rTemporal=tube([[1.35,-.055,2.35],[1.18,-.06,1.5],[.5,-.08,.52],[.75,-.08,-.55],[1.12,-.08,-1.52]],.038,temporalMat.clone(),66);
  const lNasal=tube([[-1.35,-.055,2.35],[-1.18,-.05,1.5],[-.34,-.04,.48],[.32,.04,.12],[.82,.05,-.65],[1.12,.05,-1.52]],.038,nasalMat,72);
  const rNasal=tube([[1.35,.055,2.35],[1.18,.05,1.5],[.34,.04,.48],[-.32,-.04,.12],[-.82,-.05,-.65],[-1.12,-.05,-1.52]],.038,nasalMat.clone(),72);
  scene.add(lTemporal.mesh,rTemporal.mesh,lNasal.mesh,rNasal.mesh);

  const brain=new THREE.Group();scene.add(brain);
  const brainMat=mat(0x8a7b82,{roughness:.9,clearcoat:.03,transparent:true,opacity:.9});
  const hemiL=new THREE.Mesh(new THREE.SphereGeometry(1,64,48),brainMat);hemiL.scale.set(1.18,1.02,1.7);hemiL.position.set(-1.05,0,-4.45);
  const hemiR=hemiL.clone();hemiR.material=brainMat.clone();hemiR.position.x=1.05;brain.add(hemiL,hemiR);
  const fissure=new THREE.Mesh(new THREE.BoxGeometry(.12,1.7,2.7),basic(0x332b31,{roughness:1,transparent:true,opacity:.55}));fissure.position.set(0,0,-4.45);brain.add(fissure);

  const sulcusMat=basic(0x544951,{roughness:1,transparent:true,opacity:.72});
  [-1.05,1.05].forEach(x=>{
    for(let i=-2;i<=2;i++){
      const y=i*.26;
      const a=tube([[x-.68,y,-3.82],[x-.25,y+.1*Math.sin(i),-3.68],[x+.2,y-.08*Math.cos(i),-3.78],[x+.65,y,-4.02]],.025,sulcusMat.clone(),34);brain.add(a.mesh);
    }
  });

  const occMat=mat(0x8567cf,{roughness:.52,transparent:true,opacity:.58,emissive:0x2a185e,emissiveIntensity:.55});
  const occL=new THREE.Mesh(new THREE.SphereGeometry(.72,36,26),occMat);occL.scale.set(.72,1.0,.42);occL.position.set(-1.05,0,-5.72);
  const occR=occL.clone();occR.material=occMat.clone();occR.position.x=1.05;scene.add(occL,occR);

  const radiationCurves={left:[],right:[]};
  const radMat=basic(0x9176c7,{transparent:true,opacity:.55,emissive:0x24194d,emissiveIntensity:.45,roughness:.5});
  for(let i=-2;i<=2;i++){
    const yy=i*.25;
    const L=tube([[-1.12,0,-1.52],[-1.55,yy*.45,-2.35],[-1.65,yy,-3.35],[-1.18,yy*.78,-5.45]],.052,radMat.clone(),68);scene.add(L.mesh);radiationCurves.left.push(L.curve);
    const R=tube([[1.12,0,-1.52],[1.55,yy*.45,-2.35],[1.65,yy,-3.35],[1.18,yy*.78,-5.45]],.052,radMat.clone(),68);scene.add(R.mesh);radiationCurves.right.push(R.curve);
  }

  function spriteLabel(text,pos){
    const cv=document.createElement('canvas');cv.width=512;cv.height=128;const ctx=cv.getContext('2d');ctx.clearRect(0,0,512,128);ctx.fillStyle='rgba(4,14,22,.78)';ctx.roundRect(12,18,488,92,28);ctx.fill();ctx.strokeStyle='rgba(180,235,255,.42)';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#e8f9ff';ctx.font='600 34px Manrope, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,256,64);const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));sp.position.set(...pos);sp.scale.set(2.15,.54,1);scene.add(sp);return sp;
  }
  spriteLabel(labels.chiasm,[0,.72,.45]);spriteLabel(labels.lgn,[-1.12,.65,-1.52]);spriteLabel(labels.lgn,[1.12,.65,-1.52]);spriteLabel(labels.v1,[0,1.35,-5.58]);

  const centralRadL=radiationCurves.left[2],centralRadR=radiationCurves.right[2];
  const routes=[
    [leftN.curve,lTemporal.curve,centralRadL],
    [leftN.curve,lNasal.curve,centralRadR],
    [rightN.curve,rTemporal.curve,centralRadR],
    [rightN.curve,rNasal.curve,centralRadL]
  ];
  function routePoint(route,u){const n=route.length;const scaled=Math.min(.999999,u)*n;const idx=Math.min(n-1,Math.floor(scaled));return route[idx].getPoint(scaled-idx)}
  const signalMat=basic(0x72edff,{emissive:0x35dfff,emissiveIntensity:2.8,roughness:.22});
  const particles=[];for(let i=0;i<28;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.048,12,8),signalMat);p.visible=false;scene.add(p);particles.push({p,route:routes[i%4],o:(i%7)/7})}

  let runStart=null;
  section.querySelector('#cortexRun')?.addEventListener('click',e=>{runStart=performance.now();particles.forEach(x=>x.p.visible=true);e.currentTarget.classList.add('active');setTimeout(()=>e.currentTarget.classList.remove('active'),5200)});
  loopFns.push(t=>{
    if(runStart==null)return;
    const elapsed=t-runStart,base=elapsed/4700;
    particles.forEach(x=>{const q=(base+x.o*.52)%1;x.p.position.copy(routePoint(x.route,q))});
    const pulse=Math.max(0,Math.sin(elapsed*.006));occL.material.opacity=.52+.32*pulse;occR.material.opacity=.52+.32*pulse;occL.material.emissiveIntensity=.45+1.25*pulse;occR.material.emissiveIntensity=.45+1.25*pulse;
    if(elapsed>5200){runStart=null;particles.forEach(x=>x.p.visible=false);occL.material.opacity=occR.material.opacity=.58;occL.material.emissiveIntensity=occR.material.emissiveIntensity=.55}
  });
}'''

          s,n=re.subn(r'function initDisorder\(\)\{.*?\n\}\n\nfunction initMuscles', disorder+'\n\nfunction initMuscles', s, count=1, flags=re.S)
          if n!=1: raise SystemExit('initDisorder replacement failed')
          s,n=re.subn(r'function initCortex\(\)\{.*?\n\}\n\nfunction initAll', cortex+'\n\nfunction initAll', s, count=1, flags=re.S)
          if n!=1: raise SystemExit('initCortex replacement failed')
          p.write_text(s)

          idx=Path('index.html')
          h=idx.read_text()
          h=h.replace('advanced-eye-webgl.js?v=20260917-webgl3','advanced-eye-webgl.js?v=20260917-webgl4')
          idx.write_text(h)
          PY
      - name: Commit scoped changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add advanced-eye-webgl.js index.html
          git commit -m "Refine Eye Disorders and Visual Cortex only"
          git push